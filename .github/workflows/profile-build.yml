name: Build profile assets

on:
  schedule:
    - cron: "0 */6 * * *"      # refresh live stats every 6 hours
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".github/scripts/**"
      - ".github/workflows/profile-build.yml"

permissions:
  contents: write              # publishes the generated SVGs to the `output` branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Live stats (real GitHub data)
        run: python .github/scripts/gen_stats.py --user "${{ github.repository_owner }}" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake (lavender / pink)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F472B6&color_dots=#EDE9FE,#DDD6FE,#C4B5FD,#A78BFA,#7C3AED
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F472B6&color_dots=#1F1B2E,#4C3B7A,#7C5CD6,#A78BFA,#C4B5FD

      # ── Command Center README cards (additive; can never block the steps above or the publish below) ──
      - name: Command Center cards (live data)
        id: cc
        continue-on-error: true
        run: python .github/scripts/command_center.py live --user "${{ github.repository_owner }}" --out dist --readme README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PORTFOLIO_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit refreshed project links (only when README has the markers and they changed)
        continue-on-error: true
        run: |
          if git diff --quiet -- README.md; then echo "README unchanged"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(readme): refresh project links from GitHub"
          git push

      - name: Publish to the `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
