<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="OptiLLM System Architecture">
  <defs>
    <linearGradient id="optiGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glowLight">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .node-title { font-family: 'Inter', system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
    .node-sub { font-family: 'SF Mono', 'Geist Mono', monospace; font-size: 10px; fill: #94a3b8; }
    .edge-label { font-family: 'SF Mono', 'Geist Mono', monospace; font-size: 10px; font-weight: 600; }
    .edge-line { stroke: #334155; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .active-line { stroke: #38bdf8; stroke-width: 1.5; }
  </style>

  <!-- Background Canvas -->
  <rect width="1000" height="280" rx="14" fill="#030712" stroke="#1f2937" stroke-width="1"/>

  <!-- Top Title Bar -->
  <text x="24" y="28" font-family="'SF Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8" letter-spacing="1px">
    SYSTEM ARCHITECTURE // OPTILLM GATEWAY &amp; SEMANTIC CACHE
  </text>
  <text x="976" y="28" text-anchor="end" font-family="'SF Mono', monospace" font-size="10" fill="#64748b">
    P95: 18MS (HIT) · COST REDUCTION: 86%
  </text>
  <line x1="24" y1="40" x2="976" y2="40" stroke="#1f2937" stroke-width="1"/>

  <!-- Node 1: Client Application -->
  <g transform="translate(36, 100)">
    <rect width="140" height="84" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1.2"/>
    <text x="70" y="36" text-anchor="middle" class="node-title">Client App</text>
    <text x="70" y="54" text-anchor="middle" class="node-sub">SDK / REST API</text>
    <rect x="25" y="62" width="90" height="14" rx="3" fill="#1e293b"/>
    <text x="70" y="72" text-anchor="middle" class="node-sub" fill="#38bdf8">POST /v1/chat</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="176" y1="142" x2="240" y2="142" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="240,142 233,138 233,146" fill="#38bdf8"/>

  <!-- Node 2: Semantic Gateway & Embedding -->
  <g transform="translate(244, 90)">
    <rect width="190" height="104" rx="8" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="10" y="10" width="80" height="16" rx="4" fill="#0369a1" fill-opacity="0.3"/>
    <text x="50" y="22" text-anchor="middle" class="node-sub" fill="#38bdf8">GATEWAY</text>
    <text x="95" y="48" text-anchor="middle" class="node-title">Semantic Router</text>
    <text x="95" y="66" text-anchor="middle" class="node-sub">Vector Embedding Gen</text>
    <text x="95" y="82" text-anchor="middle" class="node-sub" fill="#94a3b8">Cosine Sim &gt;= 0.94</text>
  </g>

  <!-- Branch: Cache Hit (Up) -->
  <path d="M 434,120 L 510,120 L 510,80 L 550,80" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <polygon points="550,80 543,76 543,84" fill="#10b981"/>
  <text x="490" y="72" class="edge-label" fill="#10b981">CACHE HIT</text>

  <!-- Node 3A: In-Memory Vector Cache -->
  <g transform="translate(554, 50)">
    <rect width="190" height="64" rx="8" fill="#064e3b" fill-opacity="0.2" stroke="#059669" stroke-width="1.2"/>
    <text x="95" y="28" text-anchor="middle" class="node-title" fill="#34d399">Redis Vector Store</text>
    <text x="95" y="46" text-anchor="middle" class="node-sub" fill="#a7f3d0">Instant Response (15ms)</text>
  </g>

  <!-- Branch: Cache Miss (Down) -->
  <path d="M 434,160 L 510,160 L 510,200 L 550,200" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
  <polygon points="550,200 543,196 543,204" fill="#f59e0b"/>
  <text x="490" y="218" class="edge-label" fill="#f59e0b">CACHE MISS</text>

  <!-- Node 3B: Dynamic Model Tier Router -->
  <g transform="translate(554, 168)">
    <rect width="190" height="64" rx="8" fill="#451a03" fill-opacity="0.2" stroke="#d97706" stroke-width="1.2"/>
    <text x="95" y="28" text-anchor="middle" class="node-title" fill="#fcd34d">Model Arbiter</text>
    <text x="95" y="46" text-anchor="middle" class="node-sub" fill="#fde68a">Cost / Complexity Routing</text>
  </g>

  <!-- Path to Model Providers -->
  <line x1="744" y1="200" x2="810" y2="200" stroke="#d97706" stroke-width="1.5"/>
  <polygon points="810,200 803,196 803,204" fill="#d97706"/>

  <!-- Node 4: LLM Fleet -->
  <g transform="translate(814, 100)">
    <rect width="150" height="132" rx="8" fill="#0b0f19" stroke="#334155" stroke-width="1.2"/>
    <text x="75" y="26" text-anchor="middle" class="node-title">LLM Providers</text>
    
    <rect x="12" y="38" width="126" height="24" rx="4" fill="#1e293b"/>
    <text x="75" y="54" text-anchor="middle" class="node-sub" fill="#e2e8f0">Claude 3.5 / GPT-4o</text>
    
    <rect x="12" y="68" width="126" height="24" rx="4" fill="#1e293b"/>
    <text x="75" y="84" text-anchor="middle" class="node-sub" fill="#e2e8f0">Llama 3 Local / Fast</text>

    <text x="75" y="114" text-anchor="middle" class="node-sub" fill="#38bdf8">Async Cache Write</text>
  </g>

  <!-- Feedback Line to Cache -->
  <path d="M 889,100 L 889,82 L 744,82" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="744,82 751,78 751,86" fill="#64748b"/>
</svg>
