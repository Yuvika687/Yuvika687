<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Yuvika Malhotra — AI/ML Engineer & Systems Builder">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="68%" stop-color="#0b0d1a"/>
      <stop offset="100%" stop-color="#140f2b"/>
    </linearGradient>

    <!-- Neon Horizon Glow -->
    <radialGradient id="horizonGlow" cx="50%" cy="68%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="40%" stop-color="#f472b6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0d1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="35%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- Floor Fade Mask -->
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask">
      <rect x="0" y="285" width="1200" height="135" fill="url(#floorFade)"/>
    </mask>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .star { animation: twinkle 3s ease-in-out infinite; }
    .star2 { animation: twinkle 4.5s ease-in-out infinite 1.5s; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 0.9; transform: scale(1.3); }
    }
    .hud { font-family: 'JetBrains Mono', 'Cascadia Code', 'SF Mono', Consolas, monospace; letter-spacing: 3px; font-size: 11px; fill: #22d3ee; }
    .badge { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
  </style>

  <!-- Sky Canvas -->
  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- Starry Constellation Points -->
  <g fill="#93c5fd" opacity="0.6">
    <circle cx="120" cy="65" r="1.5" class="star"/>
    <circle cx="280" cy="110" r="1.2" class="star2"/>
    <circle cx="390" cy="45" r="2" class="star"/>
    <circle cx="510" cy="90" r="1" class="star2"/>
    <circle cx="680" cy="55" r="1.8" class="star"/>
    <circle cx="820" cy="100" r="1.2" class="star2"/>
    <circle cx="950" cy="40" r="1.5" class="star"/>
    <circle cx="1070" cy="85" r="2" class="star2"/>
    <circle cx="1140" cy="140" r="1.2" class="star"/>
    <circle cx="90" cy="190" r="1.8" class="star2"/>
    <circle cx="1040" cy="210" r="1.5" class="star"/>
  </g>

  <!-- Horizon Light Sphere -->
  <circle cx="600" cy="285" r="450" fill="url(#horizonGlow)"/>

  <!-- Moving 3D Cyberpunk Grid Floor -->
  <g mask="url(#floorMask)" stroke="#8b5cf6" stroke-width="1.2" opacity="0.75">
    <!-- Perspective Rays -->
    <line x1="600" y1="285" x2="-600" y2="420"/>
    <line x1="600" y1="285" x2="-400" y2="420"/>
    <line x1="600" y1="285" x2="-200" y2="420"/>
    <line x1="600" y1="285" x2="0" y2="420"/>
    <line x1="600" y1="285" x2="150" y2="420"/>
    <line x1="600" y1="285" x2="300" y2="420"/>
    <line x1="600" y1="285" x2="420" y2="420"/>
    <line x1="600" y1="285" x2="520" y2="420"/>
    <line x1="600" y1="285" x2="600" y2="420"/>
    <line x1="600" y1="285" x2="680" y2="420"/>
    <line x1="600" y1="285" x2="780" y2="420"/>
    <line x1="600" y1="285" x2="900" y2="420"/>
    <line x1="600" y1="285" x2="1050" y2="420"/>
    <line x1="600" y1="285" x2="1200" y2="420"/>
    <line x1="600" y1="285" x2="1400" y2="420"/>
    <line x1="600" y1="285" x2="1600" y2="420"/>
    <line x1="600" y1="285" x2="1800" y2="420"/>

    <!-- Animated Horizontal Moving Lines -->
    <line x1="0" x2="1200" y1="285" y2="285">
      <animate attributeName="y1" values="285;420" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="285;420" dur="3s" begin="0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
    <line x1="0" x2="1200" y1="285" y2="285">
      <animate attributeName="y1" values="285;420" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="285;420" dur="3s" begin="-0.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
    <line x1="0" x2="1200" y1="285" y2="285">
      <animate attributeName="y1" values="285;420" dur="3s" begin="-1.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="285;420" dur="3s" begin="-1.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
    <line x1="0" x2="1200" y1="285" y2="285">
      <animate attributeName="y1" values="285;420" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="285;420" dur="3s" begin="-1.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
    <line x1="0" x2="1200" y1="285" y2="285">
      <animate attributeName="y1" values="285;420" dur="3s" begin="-2.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="285;420" dur="3s" begin="-2.0s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
    <line x1="0" x2="1200" y1="285" y2="285">
      <animate attributeName="y1" values="285;420" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
      <animate attributeName="y2" values="285;420" dur="3s" begin="-2.5s" repeatCount="indefinite" calcMode="spline" keyTimes="0;1" keySplines=".55 0 1 .45"/>
    </line>
  </g>

  <!-- Glowing Laser Horizon Line -->
  <line x1="0" y1="285" x2="1200" y2="285" stroke="#f472b6" stroke-width="2" filter="url(#neonGlow)"/>

  <!-- Top Tech HUD Frame Elements -->
  <g class="hud">
    <text x="50" y="42">// SYSTEM: ONLINE</text>
    <text x="600" y="42" text-anchor="middle">LOC: EARTH // NODE: 687</text>
    <text x="1150" y="42" text-anchor="end">KERNEL: V4.1-AI</text>
    <line x1="50" y1="52" x2="1150" y2="52" stroke="#1e1b4b" stroke-width="1.5"/>
  </g>

  <!-- Central Hero Content -->
  <g text-anchor="middle">
    <!-- Super Title Badge -->
    <rect x="440" y="80" width="320" height="30" rx="15" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.4"/>
    <text x="600" y="100" class="badge" fill="#c084fc">⚡ ARCHITECT &amp; ENGINEER</text>

    <!-- Main Name Title with Glowing Neon Shadow -->
    <text x="600" y="172" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="4px" fill="none" stroke="#8b5cf6" stroke-width="8" opacity="0.4" filter="url(#neonGlow)">
      YUVIKA MALHOTRA
    </text>
    <text x="600" y="172" font-family="'Segoe UI', -apple-system, system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="4px" fill="url(#titleGrad)">
      YUVIKA MALHOTRA
    </text>

    <!-- Subtitle -->
    <text x="600" y="218" font-family="'JetBrains Mono', monospace" font-size="15" font-weight="500" letter-spacing="4px" fill="#e2e8f0">
      ARTIFICIAL INTELLIGENCE · COMPUTER VISION · DISTRIBUTED SYSTEMS
    </text>

    <!-- Interactive Status Capsules -->
    <g transform="translate(600, 248)">
      <rect x="-240" y="0" width="480" height="26" rx="13" fill="#0b0d1a" stroke="#334155" stroke-width="1"/>
      <circle cx="-218" cy="13" r="4" fill="#a3e635">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="1.5px">
        STATUS: SHIPPING PRODUCTION AI &amp; MASTERING PATTERNS
      </text>
    </g>
  </g>
</svg>
