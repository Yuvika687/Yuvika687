<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Commit Activity ECG Monitor">
  <defs>
    <linearGradient id="ecgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="30%" stop-color="#22d3ee"/>
      <stop offset="70%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="ecgGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .gridline { stroke: #1e1b4b; stroke-width: 0.7; stroke-opacity: 0.6; }
    .trace {
      stroke-dasharray: 2400;
      stroke-dashoffset: 2400;
      animation: beat 5s linear infinite;
    }
    @keyframes beat {
      0% { stroke-dashoffset: 2400; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <rect width="1200" height="120" rx="14" fill="#0b0d1a" stroke="#1e1b4b"/>

  <!-- Oscilloscope Grid Background -->
  <line x1="0" y1="30" x2="1200" y2="30" class="gridline"/>
  <line x1="0" y1="60" x2="1200" y2="60" class="gridline"/>
  <line x1="0" y1="90" x2="1200" y2="90" class="gridline"/>
  <line x1="200" y1="0" x2="200" y2="120" class="gridline"/>
  <line x1="400" y1="0" x2="400" y2="120" class="gridline"/>
  <line x1="600" y1="0" x2="600" y2="120" class="gridline"/>
  <line x1="800" y1="0" x2="800" y2="120" class="gridline"/>
  <line x1="1000" y1="0" x2="1000" y2="120" class="gridline"/>

  <!-- Oscilloscope HUD Text -->
  <text x="24" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#22d3ee" letter-spacing="2px">
    PULSE: 72 BPM // TELEMETRY: 100% RELENTLESS
  </text>
  <text x="1176" y="24" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="1.5px">
    SAMPLING: REALTIME COMMIT VOLTAGE
  </text>

  <!-- ECG Trace Path with Spikes -->
  <path class="trace" fill="none" stroke="url(#ecgGrad)" stroke-width="2.5" filter="url(#ecgGlow)"
    d="M 0,60 L 120,60 L 135,50 L 145,70 L 160,60 L 200,60 L 220,58 L 230,18 L 245,102 L 255,60 L 270,60 L 290,48 L 310,60 
       L 420,60 L 435,52 L 445,68 L 460,60 L 500,60 L 520,58 L 530,14 L 545,106 L 555,60 L 570,60 L 590,46 L 610,60 
       L 720,60 L 735,52 L 745,68 L 760,60 L 800,60 L 820,58 L 830,12 L 845,108 L 855,60 L 870,60 L 890,46 L 910,60 
       L 1020,60 L 1035,52 L 1045,68 L 1060,60 L 1100,60 L 1120,58 L 1130,16 L 1145,104 L 1155,60 L 1200,60" />
</svg>
