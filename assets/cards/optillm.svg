<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230" viewBox="0 0 580 230" role="img" aria-label="OptiLLM — AI GATEWAY · SEMANTIC CACHE">
<title>OptiLLM — AI GATEWAY · SEMANTIC CACHE</title>
<defs>
  <linearGradient id="bd_optillm" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#8b5cf6"/>
    <stop offset=".5" stop-color="#1e1b4b"/>
    <stop offset="1" stop-color="#22d3ee"/>
    <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="sh_optillm" x1="0" x2="1">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".07"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <radialGradient id="gl_optillm" cx="0" cy="0" r="1">
    <stop offset="0" stop-color="#8b5cf6" stop-opacity=".3"/>
    <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="cl_optillm"><rect width="580" height="230" rx="20"/></clipPath>
</defs>
<style>
  .t_optillm{font:700 23px 'Segoe UI', system-ui, -apple-system, sans-serif;fill:#e2e8f0}
  .c_optillm{font:700 11px 'JetBrains Mono', monospace;letter-spacing:2px;fill:#22d3ee}
  .d_optillm{font:400 14px 'Segoe UI', system-ui, -apple-system, sans-serif;fill:#94a3b8}
  .tag_optillm{font:600 11px 'JetBrains Mono', monospace;fill:#8b5cf6}
  .st_optillm{font:700 12px 'JetBrains Mono', monospace;fill:#a3e635}
  .dot_optillm{animation:p_optillm 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes p_optillm{to{transform:scale(3);opacity:0}}
  .sw_optillm{animation:sw_optillm 5s ease-in-out infinite}
  @keyframes sw_optillm{0%{transform:translateX(-300px) skewX(-20deg)}60%,100%{transform:translateX(780px) skewX(-20deg)}}
  .ic_optillm{animation:bob_optillm 4s ease-in-out infinite}
  @keyframes bob_optillm{50%{transform:translateY(-4px)}}
</style>
<g clip-path="url(#cl_optillm)">
  <rect width="580" height="230" fill="#0b0d1a"/>
  <circle cx="0" cy="0" r="260" fill="url(#gl_optillm)"/>
  <rect class="sw_optillm" x="0" y="0" width="160" height="230" fill="url(#sh_optillm)"/>
</g>
<rect x="1" y="1" width="578" height="228" rx="19" fill="none" stroke="url(#bd_optillm)" stroke-width="2"/>
<g class="ic_optillm">
  <rect x="28" y="24" width="46" height="46" rx="12" fill="#8b5cf6" fill-opacity=".15" stroke="#8b5cf6" stroke-opacity=".45"/>
  <text x="51" y="56" text-anchor="middle" font-size="24">⚡</text>
</g>
<text x="88" y="55" class="t_optillm">OptiLLM</text>
<text x="552" y="42" text-anchor="end" class="c_optillm">AI GATEWAY · SEMANTIC CACHE</text>
<text x="28" y="104" class="d_optillm">Intelligent AI routing gateway featuring</text>
<text x="28" y="126" class="d_optillm">semantic caching, dynamic model fallback,</text>
<text x="28" y="148" class="d_optillm">and real-time token cost analytics.</text>

<g transform="translate(28 178)">
  <rect width="72" height="26" rx="13" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".45"/>
  <text x="36.0" y="17" text-anchor="middle" class="tag_optillm">Python</text>
</g>
<g transform="translate(108 178)">
  <rect width="81" height="26" rx="13" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".45"/>
  <text x="40.5" y="17" text-anchor="middle" class="tag_optillm">FastAPI</text>
</g>
<g transform="translate(197 178)">
  <rect width="63" height="26" rx="13" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".45"/>
  <text x="31.5" y="17" text-anchor="middle" class="tag_optillm">Redis</text>
</g>
<g transform="translate(268 178)">
  <rect width="54" height="26" rx="13" fill="#8b5cf6" fill-opacity=".12" stroke="#8b5cf6" stroke-opacity=".45"/>
  <text x="27.0" y="17" text-anchor="middle" class="tag_optillm">LLMs</text>
</g>

<circle cx="490" cy="191" r="5" fill="#a3e635"/>
<circle cx="490" cy="191" r="5" fill="#a3e635" class="dot_optillm"/>
<text x="502" y="195" class="st_optillm">source ↗</text>
</svg>
